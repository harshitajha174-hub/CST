<!DOCTYPE html>
<html>
<head>
    <!-- Requirement: Title the web page "Restaurant Menu" -->
    <title>Restaurant Menu</title>
    
</head>
<body>

    <table border="1" cellpadding="8" cellspacing="0">
        
        <!-- Requirement: Use caption -->
        <caption>Today's Special Menu</caption>
        
        <!-- Table Column Headers -->
        <tr align="center">
            <th>Category</th>
            <th>Food Item</th>
            <th>Price (₹)</th>
        </tr>

        <!-- STARTERS CATEGORY (Rowspan used to group 3 items) -->
        <tr align="center">
            <td rowspan="3" class="starters-cell">Starters</td>
            <td align="left">Spring Rolls</td>
            <td>120</td>
        </tr>
        <tr align="center">
            <td align="left">Garlic Bread</td>
            <td>100</td>
        </tr>
        <tr align="center">
            <td align="left">Veg Soup</td>
            <td>120</td>
        </tr>

        <!-- MAIN COURSE CATEGORY (Rowspan used to group 3 items) -->
        <tr align="center">
            <td rowspan="3" class="main-cell">Main Course</td>
            <td align="left">Paneer Butter Masala</td>
            <td>180</td>
        </tr>
        <tr align="center">
            <td align="left">Veg Biryani</td>
            <td>150</td>
        </tr>
        <tr align="center">
            <td align="left">Dal Tadka</td>
            <td>120</td>
        </tr>

        <!-- DESSERTS CATEGORY (Rowspan used to group 3 items) -->
        <tr align="center">
            <td rowspan="3" class="desserts-cell">Desserts</td>
            <td align="left">Chocolate Cake</td>
            <td>90</td>
        </tr>
        <tr align="center">
            <td align="left">Ice Cream</td>
            <td>70</td>
        </tr>
        <tr align="center">
            <td align="left">Gulab Jamun</td>
            <td>60</td>
        </tr>

        <!-- DRINKS CATEGORY (Rowspan used to group 3 items) -->
        <tr align="center">
            <td rowspan="3" class="drinks-cell">Drinks</td>
            <td align="left">Fresh Lime Soda</td>
            <td>50</td>
        </tr>
        <tr align="center">
            <td align="left">Cold Coffee</td>
            <td>80</td>
        </tr>
        <tr align="center">
            <td align="left">Mango Shake</td>
            <td>70</td>
        </tr>

    </table>

</body>
</html>
